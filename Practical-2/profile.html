<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Profile</title>
    <link rel="stylesheet" href="../Practical-3/style.css">
</head>

<body class="Profile with-sidebar">

    <aside class="sidebar">
        <div class="brand">
            <img src="https://static.vecteezy.com/system/resources/previews/020/274/235/non_2x/student-icon-for-your-website-design-logo-app-ui-free-vector.jpg"
                alt="Student Hub Logo" class="Logo">
            <h1>Student Hub</h1>
        </div>

        <nav class="navbar">
            <a href="index.html">Home</a>
            <a href="attandence.html">Attendance</a>
            <a href="courses.html">Courses</a>
            <a href="assignment.html">Assignment</a>
            <a href="result.html">Result</a>
            <a href="profile.html" class="active">Profile</a>
            <a href="event.html">Events</a>
            <a href="Feedback.html">Feedback</a>
            <a href="contact.html">Contact</a>
            <a href="setting.html">Settings</a>
            <a href="register.html">Register</a>
        </nav>
    </aside>

    <header>
        <h1>Profile</h1>
    </header>

    <div class="profile-box">

        <form action="../Practical-7/process.php" method="POST">

            <label>Enter your Photo</label><br>
            <input type="file" id="imageInput" accept="image/*"><br><br>

            <label for="studentName">Name</label><br>
            <input type="text" id="studentName" name="name" placeholder="Enter your name">
            <br><br>

            <label>Choose your Gender:</label>

            <div class="gender">
                <input type="radio" name="gender" id="male" value="Male">
                <label for="male">Male</label>

                <input type="radio" name="gender" id="female" value="Female">
                <label for="female">Female</label>

                <input type="radio" name="gender" id="other" value="Other">
                <label for="other">Other</label>
            </div>

            <label for="studentId">Student Id:</label><br>
            <input type="text" id="studentId" name="student_id" placeholder="Enter your Id">
            <br><br>

            <label for="mobileNumber">Mobile Number:</label><br>
            <input type="text" id="mobileNumber" name="mobile" placeholder="Enter your mobile number">
            <br><br>

            <label for="collegeName">School/College Name:</label><br>
            <input type="text" id="collegeName" name="college" placeholder="Enter college/school name">
            <br><br>

            <label for="branch">Branch:</label><br>

            <select id="branch" name="branch">
                <option value="">-- Select Branch --</option>
                <option value="CE">Computer Engineering (CE)</option>
                <option value="IT">Information Technology (IT)</option>
                <option value="CSE">Computer Science Engineering (CSE)</option>
                <option value="ME">Mechanical Engineering (ME)</option>
                <option value="EE">Electrical Engineering (EE)</option>
                <option value="EC">Electronics & Communication (EC)</option>
                <option value="Civil">Civil Engineering</option>
            </select>

            <br><br>

            <label for="address">Address:</label><br>
            <textarea id="address" name="address" rows="4" cols="30"
                placeholder="Enter your Address"></textarea>

            <br><br>

            <label>Hobbies:</label>

            <div class="hobbies">
                <label>
                    <input type="checkbox" name="hobbies[]" value="Reading">
                    Reading
                </label>

                <label>
                    <input type="checkbox" name="hobbies[]" value="Music">
                    Music
                </label>

                <label>
                    <input type="checkbox" name="hobbies[]" value="Sports">
                    Sports
                </label>

                <label>
                    <input type="checkbox" name="hobbies[]" value="Traveling">
                    Traveling
                </label>

                <label>
                    <input type="checkbox" name="hobbies[]" value="Gaming">
                    Gaming
                </label>
            </div>

            <br>

            <button type="submit">Submit</button>

        </form>
    </div>

    <div id="studentData"></div>

    <script>
fetch('../Practical-6/student.json')
    .then(response => response.json())
    .then(students => {

        const student = students[3];

        document.getElementById('studentName').value = student.name;
        document.getElementById('studentId').value = student.id;
        document.getElementById('mobileNumber').value = student.mobile;
        document.getElementById('collegeName').value = student.college;
        document.getElementById('branch').value = student.branch;
        document.getElementById('address').value = student.address;

        if (student.gender) {
            document.querySelector(
                'input[name="gender"][value="' + student.gender + '"]'
            ).checked = true;
        }
    })
    .catch(error => {
        console.log(error);
    });
</script>

    <center>
        <p>Thank You for Visiting Student Hub ❤️</p>
        <p>@ 2026 Student Hub</p>
    </center>

    <script src="../Practical-4/script.js"></script>

</body>

</html>
