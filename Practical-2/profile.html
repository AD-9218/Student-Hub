    <header>
        <h1>Profile</h1>
    </aside><br>
    <div class="profile-box">

    <form >

        <lable>Enter your Photo</lable><br>
        <input type="file" id="imageInput" accept="image/*"><br><br>
        
    <label for="text">Name</label><br>
    <input type="text" placeholder="Enter your name"><br><br>
    
    <label>Choose your Gender :</label>

<div class="gender">
    <input type="radio" name="gender" id="male">
    <label for="male">Male</label>

    <input type="radio" name="gender" id="female">
    <label for="female">Female</label>

    <input type="radio" name="gender" id="other">
    <label for="other">Other</label>
</div>
    
    <label for="text">Student Id :</label>
    <input type="text" placeholder="Enter your Id"><br><br>
    
    <label for="text">Moblie Number :</label>
    <input type="text" placeholder="Enter your mobile number"><br><br>
    
    <label for="text">School/College Name :</label>
    <input type="text" placeholder="Enter college/school name"><br><br>
    
    <label for="text">Brance :</label><br>
    <select id="branch" name="branch">
        <option value="">-- Select Branch --</option>
        <option value="CE">Computer Engineering (CE)</option>
        <option value="IT">Information Technology (IT)</option>
        <option value="CSE">Computer Science Engineering (CSE)</option>
        <option value="ME">Mechanical Engineering (ME)</option>
        <option value="EE">Electrical Engineering (EE)</option>
        <option value="EC">Electronics & Communication (EC)</option>
        <option value="Civil">Civil Engineering</option>
    </select><br><br>

    <label for="">Adress :</label><br>
    <textarea type="text" rows="4" cols="30" placeholder="Enter your Adress"></textarea><br><br>

    <label>Hobbies :</label>

<div class="hobbies">
    <label><input type="checkbox"> Reading</label>
    <label><input type="checkbox"> Music</label>
    <label><input type="checkbox"> Sports</label>
    <label><input type="checkbox"> Traveling</label>
    <label><input type="checkbox"> Gaming</label>
</div>
    
    </form>

</div>
