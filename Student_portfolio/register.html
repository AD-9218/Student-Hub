<!DOCTYPE html>
<html>
<head>
    <title>Event Registration</title>
</head>
<body>

<h1 align="center">📝 Event Registration Form</h1>

<hr>

<form>

<label for="name">Full Name:</label><br>
<input type="text" id="name" placeholder="Enter your full name"><br><br>

<label for="roll">Roll Number:</label><br>
<input type="text" id="roll" placeholder="Enter your roll number"><br><br>

<label for="email">Email:</label><br>
<input type="email" id="email" placeholder="Enter your email"><br><br>

<label for="phone">Phone Number:</label><br>
<input type="tel" id="phone" placeholder="Enter your phone number"><br><br>

<label for="semester">Semester:</label><br>
<input type="text" id="semester" placeholder="Enter your semester"><br><br>

<label>Select Event:</label><br>

<select>
    <option>24-Hour Coding Challenge</option>
    <option>AI & Machine Learning Workshop</option>
    <option>Web Development Bootcamp</option>
</select>

<br><br>

<label>Why do you want to participate?</label><br>

<textarea rows="5" cols="40" placeholder="Write your answer here..."></textarea>

<br><br>

<input type="submit" value="Register">

<input type="reset" value="Reset">

</form>

<hr>

<a href="event.html">⬅️ Back to Events</a>

</body>
<center><p>Thank You for Visiting Student Hub ❤️</p></center>
<center><p>@ 2026 Student Hub </p></center>

</html>
