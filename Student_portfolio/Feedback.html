<!DOCTYPE html>
<html>
<head>
    <title>Feedback</title>
</head>
<body>

    <h1 align="center">💬 Student Feedback</h1>

    <hr>

    <form>

        <fieldset>
            <legend><b>👤 Personal Details</b></legend>

            <label for="name">Name:</label><br>
            <input type="text" id="name" placeholder="Enter your name"><br><br>

            <label for="roll">Roll Number:</label><br>
            <input type="text" id="roll" placeholder="Enter roll number"><br><br>

            <label for="email">Email:</label><br>
            <input type="email" id="email" placeholder="Enter your email">

        </fieldset>

        <br>

        <fieldset>
            <legend><b>📚 Select Feedback Type</b></legend>

            <select>
                <option>Course</option>
                <option>Faculty</option>
                <option>Event</option>
                <option>Website</option>
            </select>

        </fieldset>

        <br>

        <fieldset>
            <legend><b>⭐ Overall Rating</b></legend>

            <input type="radio" name="rating" value="5"> ⭐⭐⭐⭐⭐ (5 Stars)<br><br>

            <input type="radio" name="rating" value="4"> ⭐⭐⭐⭐ (4 Stars)<br><br>

            <input type="radio" name="rating" value="3"> ⭐⭐⭐ (3 Stars)<br><br>

            <input type="radio" name="rating" value="2"> ⭐⭐ (2 Stars)<br><br>

            <input type="radio" name="rating" value="1"> ⭐ (1 Star)

        </fieldset>

        <br>

        <fieldset>
            <legend><b>💭 Suggestions</b></legend>

            <textarea rows="5" cols="50"
                placeholder="Write your suggestions here..."></textarea>

        </fieldset>

        <br>

        <fieldset>
            <legend><b>📝 Additional Comments</b></legend>

            <textarea rows="5" cols="50"
                placeholder="Enter your comments here..."></textarea>

        </fieldset>

        <br>

        <input type="submit" value="Submit">

        <input type="reset" value="Reset">

    </form>

    <hr>

    <p align="center">
        <b>🙏 Thank You for Your Valuable Feedback!</b>
    </p>

</body>
<center><p>Thank You for Visiting Student Hub ❤️</p></center>
<center><p>@ 2026 Student Hub </p></center>
</html>
